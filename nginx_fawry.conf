# =============================================================================
# Nginx reverse-proxy for the Cornea Dashboard
#
# Install:
#   sudo cp nginx_fawry.conf /etc/nginx/conf.d/fawry_dashboard.conf
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 9110 ssl;
    server_name ngnx-fawryplus.fawrypayments.com;

    # ── TLS certificates ────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/ngnx-fawryplus.fawrypayments.com.crt;   # <-- update path
    ssl_certificate_key /etc/nginx/ssl/ngnx-fawryplus.fawrypayments.com.key;   # <-- update path

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   HIGH:!aNULL:!MD5;

    location = /api/v1 {
        return 301 /api/v1/;
    }

    # ── FastAPI backend ─────────────────────────────────────────────────────
    # ^~ prevents this prefix from losing to a catch-all location / elsewhere.
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Dashboard UI (Vite/React served by container Nginx on 3063) ─────────
    location / {
        proxy_pass http://127.0.0.1:3063/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
