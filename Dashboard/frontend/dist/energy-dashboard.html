<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energy Dashboard - EcoSync</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0F1110;
      --bg-card-dark: #181A19;
      --bg-card-light: #D8E2DC;
      --text-primary: #FFFFFF;
      --text-secondary: #9CA3AF;
      --text-inverse: #111111;
      --text-inverse-muted: #4B5563;
      --border-subtle: #272925;
      --accent-mint: #A7F3D0;
      --accent-mint-light: #D1FAE5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 256px;
      background: var(--bg-base);
      border-right: 1px solid rgba(39, 41, 37, 0.3);
      padding: 32px 24px;
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      z-index: 30;
      display: flex;
      flex-direction: column;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--bg-card-dark);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 20px;
      height: 20px;
      color: white;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      padding: 12px 16px;
      border-radius: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
      transition: all 0.2s;
      cursor: pointer;
      background: none;
      border: none;
      text-align: left;
    }

    .nav-item:hover {
      background: rgba(24, 26, 25, 0.5);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--bg-card-dark);
      color: var(--text-primary);
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 40px;
    }

    .status-card {
      background: var(--bg-card-dark);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(39, 41, 37, 0.3);
    }

    .status-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-mint);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-size: 12px;
      color: var(--text-primary);
    }

    .main {
      flex: 1;
      margin-left: 256px;
      padding: 32px;
      max-width: 1440px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .time-display {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .time-value {
      font-size: 28px;
      font-weight: 300;
      color: var(--text-primary);
    }

    .time-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .grid {
      display: grid;
      gap: 24px;
      margin-bottom: 24px;
    }

    .grid-3 {
      grid-template-columns: 1.5fr 1fr 0.8fr;
    }

    .grid-3-bottom {
      grid-template-columns: 0.8fr 1.2fr 1fr;
    }

    @media (max-width: 1024px) {
      .grid-3, .grid-3-bottom {
        grid-template-columns: 1fr;
      }
    }

    .card {
      border-radius: 24px;
      padding: 24px;
    }

    .card-dark {
      background: var(--bg-card-dark);
      border: 1px solid rgba(39, 41, 37, 0.3);
    }

    .card-light {
      background: var(--bg-card-light);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
    }

    .card-dark .card-title {
      color: var(--text-primary);
    }

    .card-light .card-title {
      color: var(--text-inverse);
    }

    .pill-button {
      background: transparent;
      border: 1px solid #4B5563;
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .pill-button:hover {
      border-color: var(--text-secondary);
    }

    .stat-value {
      font-size: 48px;
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .card-dark .stat-value {
      color: var(--text-primary);
    }

    .card-light .stat-value {
      color: var(--text-inverse);
    }

    .stat-unit {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.4;
      margin-top: 4px;
    }

    .card-dark .stat-unit {
      color: var(--text-secondary);
    }

    .card-light .stat-unit {
      color: var(--text-inverse-muted);
    }

    .toggle {
      position: relative;
      display: inline-flex;
      height: 24px;
      width: 40px;
      align-items: center;
      border-radius: 12px;
      background: #374151;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle.active {
      background: var(--border-subtle);
    }

    .toggle-knob {
      position: absolute;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle.active .toggle-knob {
      transform: translateX(16px);
    }

    .sparkline {
      display: flex;
      align-items: end;
      gap: 3px;
      height: 60px;
      justify-content: center;
    }

    .sparkline-bar {
      width: 3px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 2px;
      transition: background 0.2s;
    }

    .sparkline-bar:hover {
      background: rgba(255, 255, 255, 0.8);
    }

    .weekly-chart {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 8px;
    }

    .day-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .day-header {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 11px;
    }

    .day-trend {
      color: var(--text-secondary);
    }

    .day-trend.up {
      color: var(--text-primary);
    }

    .day-name {
      color: var(--text-secondary);
      font-weight: 500;
      text-transform: uppercase;
    }

    .day-bar {
      width: 6px;
      background: var(--border-subtle);
      border-radius: 3px;
      transition: background 0.2s;
    }

    .day-bar.active {
      background: var(--text-primary);
    }

    .day-value {
      font-size: 11px;
      color: var(--text-secondary);
      font-family: 'SF Mono', Monaco, monospace;
    }

    .timeline {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .timeline-node {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid;
      flex-shrink: 0;
    }

    .timeline-node.filled {
      background: var(--text-inverse);
      border-color: var(--text-inverse);
    }

    .timeline-node.outlined {
      background: transparent;
      border-color: var(--text-inverse);
    }

    .timeline-connector {
      flex: 1;
      border-top: 2px dotted var(--border-subtle);
      min-width: 32px;
    }

    .progress-track {
      height: 6px;
      background: var(--border-subtle);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--text-primary);
      border-radius: 3px;
      transition: width 0.5s;
    }

    .iso-container {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
      filter: drop-shadow(0 0 40px rgba(167, 243, 208, 0.15));
    }

    .recommendation {
      background: rgba(26, 26, 26, 0.6);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(39, 41, 37, 0.2);
      margin-bottom: 12px;
    }

    .recommendation:last-child {
      margin-bottom: 0;
    }

    .recommendation-text {
      font-size: 14px;
      color: var(--text-primary);
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      color: var(--accent-mint);
      background: rgba(167, 243, 208, 0.1);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .link {
      font-size: 11px;
      color: var(--accent-mint);
      text-decoration: none;
    }

    .link:hover {
      text-decoration: underline;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .card-light .subtitle {
      color: var(--text-inverse-muted);
    }

    .mobile-menu-btn {
      display: none;
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 50;
      width: 40px;
      height: 40px;
      background: var(--bg-card-dark);
      border: 1px solid rgba(39, 41, 37, 0.3);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 18px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 768px) {
      .mobile-menu-btn {
        display: flex;
      }

      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        margin-left: 0;
        padding-top: 80px;
      }

      .grid-3, .grid-3-bottom {
        grid-template-columns: 1fr;
      }
    }

    .category {
      text-align: center;
    }

    .category-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .category-trend {
      font-size: 12px;
    }

    .category-trend.up {
      color: var(--accent-mint);
    }

    .category-trend.down {
      color: var(--text-secondary);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .status-label-text {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .status-badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--accent-mint);
      margin-right: 12px;
    }

    @media (max-width: 768px) {
      .stat-value {
        font-size: 40px;
      }

      .page-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Sparkline component
    function Sparkline({ data }) {
      const max = Math.max(...data, 1);
      return (
        <div className="sparkline">
          {data.map((val, i) => (
            <div
              key={i}
              className="sparkline-bar"
              style={{ height: `${(val / max) * 100}%` }}
            />
          ))}
        </div>
      );
    }

    // Toggle switch component
    function Toggle({ checked, onChange }) {
      return (
        <div className={`toggle ${checked ? 'active' : ''}`} onClick={() => onChange && onChange(!checked)}>
          <div className="toggle-knob"></div>
        </div>
      );
    }

    // Weekly bar chart component
    function WeeklyChart({ data, highlightedIndex }) {
      const max = Math.max(...data.map(d => d.value), 1);
      return (
        <div className="weekly-chart">
          {data.map((item, i) => (
            <div key={i} className="day-column">
              <div className="day-header">
                <span className={`day-trend ${item.trend === 'up' ? 'up' : ''}`}>
                  {item.trend === 'up' ? '↑' : '↓'}
                </span>
                <span className="day-name">{item.day}</span>
              </div>
              <div
                className={`day-bar ${i === highlightedIndex ? 'active' : ''}`}
                style={{ height: `${(item.value / max) * 40 + 8}px` }}
              />
              <span className="day-value">{item.value}</span>
            </div>
          ))}
        </div>
      );
    }

    // Timeline nodes component
    function TimelineNodes({ nodes }) {
      return (
        <div className="timeline">
          {nodes.map((node, i) => (
            <React.Fragment key={i}>
              <div className={`timeline-node ${node.filled ? 'filled' : 'outlined'}`} />
              {i < nodes.length - 1 && <div className="timeline-connector" />}
            </React.Fragment>
          ))}
        </div>
      );
    }

    // Logo Icon
    function LogoIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z" />
          <path d="M2 17l10 5 10-5" />
          <path d="M2 12l10 5 10-5" />
        </svg>
      );
    }

    // Isometric illustration
    function IsometricOffice() {
      return (
        <div className="iso-container">
          <svg viewBox="0 0 200 150" width="180" height="135" style={{ opacity: 0.5 }}>
            <path d="M20 80 L100 40 L180 80 L100 120 Z" fill="none" stroke="#A7F3D0" strokeWidth="1" opacity="0.4" />
            <path d="M20 80 L20 110 L100 150 L100 120" fill="none" stroke="#A7F3D0" strokeWidth="1" opacity="0.3" />
            <path d="M100 120 L100 150 L180 110 L180 80" fill="none" stroke="#A7F3D0" strokeWidth="1" opacity="0.3" />
            <rect x="60" y="70" width="30" height="25" fill="none" stroke="#A7F3D0" strokeWidth="1" opacity="0.5" />
            <rect x="110" y="60" width="25" height="20" fill="none" stroke="#A7F3D0" strokeWidth="1" opacity="0.4" />
            <circle cx="130" cy="85" r="8" fill="none" stroke="#A7F3D0" strokeWidth="1" opacity="0.4" />
          </svg>
        </div>
      );
    }

    // Main App
    function App() {
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [greenEnabled, setGreenEnabled] = useState(true);
      const [currentTime, setCurrentTime] = useState('');

      useEffect(() => {
        const updateTime = () => {
          setCurrentTime(new Date().toLocaleTimeString('en-US', {
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
          }));
        };
        updateTime();
        const interval = setInterval(updateTime, 60000);
        return () => clearInterval(interval);
      }, []);

      const consumptionData = [
        { label: 'Lighting', trend: 'up', sparkline: [45, 52, 48, 61, 55, 67, 71], range: '52–71', unit: 'kWh per month' },
        { label: 'Refrigerator', trend: 'down', sparkline: [35, 32, 31, 29, 33, 30, 37], range: '29–37', unit: 'kWh per month' },
        { label: 'Air Conditioner', trend: 'down', sparkline: [65, 58, 52, 49, 55, 72, 85], range: '49–85', unit: 'kWh per month' },
      ];

      const weeklyData = [
        { day: 'Mon', value: 276, trend: 'up' },
        { day: 'Tue', value: 282, trend: 'up' },
        { day: 'Wed', value: 297, trend: 'up' },
        { day: 'Thu', value: 269, trend: 'down' },
        { day: 'Fri', value: 274, trend: 'down' },
        { day: 'Sat', value: 175, trend: 'down' },
        { day: 'Sun', value: 138, trend: 'down' },
      ];

      const timelineNodes = [
        { filled: false },
        { filled: true },
        { filled: true },
        { filled: true },
        { filled: true },
      ];

      return (
        <div className="app">
          <button className="mobile-menu-btn" onClick={() => setSidebarOpen(!sidebarOpen)}>
            {sidebarOpen ? '✕' : '☰'}
          </button>

          <aside className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
            <div className="logo">
              <div className="logo-icon">
                <LogoIcon />
              </div>
              <span className="logo-text">EcoSync</span>
            </div>

            <nav className="nav">
              <button className="nav-item active">Dashboard</button>
              <button className="nav-item">My apartments</button>
              <button className="nav-item">Reporting</button>
              <button className="nav-item">Settings</button>
            </nav>

            <div className="sidebar-footer">
              <div className="status-card">
                <div className="status-label">Energy Management</div>
                <div className="status-indicator">
                  <div className="status-dot"></div>
                  <span className="status-text">System Active</span>
                </div>
              </div>
            </div>
          </aside>

          <main className="main">
            <div className="header">
              <h1 className="page-title">Overview</h1>
              <div className="time-display">
                <span className="time-value">{currentTime}</span>
                <span className="time-label">Time</span>
              </div>
            </div>

            <div className="grid grid-3">
              {/* Total Energy Consumption */}
              <div className="card card-dark">
                <div className="card-header">
                  <span className="card-title">Total energy consumption</span>
                  <button className="pill-button">Change module</button>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px', marginBottom: '20px' }}>
                  {consumptionData.map((item, i) => (
                    <div key={i} className="category">
                      <div className="category-label">
                        <span>{item.label}</span>
                        <span className={`category-trend ${item.trend}`}>
                          {item.trend === 'up' ? '↑' : '↓'}
                        </span>
                      </div>
                      <Sparkline data={item.sparkline} />
                    </div>
                  ))}
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px', paddingTop: '16px', borderTop: '1px solid rgba(39, 41, 37, 0.3)' }}>
                  {consumptionData.map((item, i) => (
                    <div key={i} style={{ textAlign: 'center' }}>
                      <div className="stat-value">{item.range}</div>
                      <div className="stat-unit">{item.unit}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Green Connections */}
              <div className="card card-dark">
                <div className="card-header">
                  <span className="card-title">Green connections</span>
                  <button className="pill-button" style={{ padding: '4px 8px', fontSize: '14px' }}>⋮</button>
                </div>

                <div className="status-row">
                  <span className="status-label-text">Office</span>
                  <div style={{ display: 'flex', alignItems: 'center' }}>
                    <span className="status-badge">Connected</span>
                    <Toggle checked={greenEnabled} onChange={setGreenEnabled} />
                  </div>
                </div>

                <IsometricOffice />

                <div style={{ marginTop: '16px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                    <span style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>Available energy</span>
                    <span style={{ fontSize: '13px', color: 'var(--text-primary)' }}>83%</span>
                  </div>
                  <div className="progress-track">
                    <div className="progress-fill" style={{ width: '83%' }}></div>
                  </div>
                </div>
              </div>

              {/* Recommendations */}
              <div className="card card-dark">
                <div style={{ marginBottom: '16px' }}>
                  <span className="card-title">Recommended</span>
                  <p className="subtitle">Personalized tips for you</p>
                </div>

                <div className="recommendation">
                  <p className="recommendation-text">Sunny day ahead — consider maximizing solar gain</p>
                  <span className="tag">Today recommendation</span>
                </div>

                <div className="recommendation">
                  <p className="recommendation-text">Run appliances at off-peak hours to reduce grid load</p>
                  <a href="#" className="link">Analysis →</a>
                </div>
              </div>
            </div>

            <div className="grid grid-3-bottom">
              {/* Tracking */}
              <div className="card card-light">
                <div className="card-header">
                  <span className="card-title">Tracking</span>
                  <button className="pill-button" style={{ borderColor: 'var(--text-inverse-muted)', color: 'var(--text-inverse)' }}>⋮</button>
                </div>
                <p className="subtitle">Solar energy tomorrow</p>
                <div style={{ marginTop: '24px' }}>
                  <div className="stat-value">5.7</div>
                  <div className="stat-unit">kWh</div>
                </div>
              </div>

              {/* Detailed Report */}
              <div className="card card-dark">
                <div className="card-header">
                  <span className="card-title">Detailed report</span>
                  <button className="pill-button">Week ↓</button>
                </div>
                <p className="subtitle">Graphs of energy consumption</p>
                <div style={{ marginTop: '24px' }}>
                  <WeeklyChart data={weeklyData} highlightedIndex={2} />
                </div>
              </div>

              {/* Green Energy Usage */}
              <div className="card card-light">
                <div style={{ marginBottom: '4px' }}>
                  <span className="card-title">Green energy usage</span>
                </div>
                <p className="subtitle">Peak hours overview</p>
                <div style={{ marginTop: '24px', marginBottom: '24px' }}>
                  <div className="stat-value">47%</div>
                  <div className="stat-unit">11AM — 3PM</div>
                </div>
                <TimelineNodes nodes={timelineNodes} />
              </div>
            </div>

            <div style={{ marginTop: '40px', padding: '24px', background: 'rgba(24, 26, 25, 0.5)', borderRadius: '16px', border: '1px solid rgba(39, 41, 37, 0.3)' }}>
              <p style={{ fontSize: '14px', color: 'var(--text-secondary)', lineHeight: '1.6' }}>
                <strong style={{ color: 'var(--text-primary)' }}>Production Dashboard Preserved:</strong> The original Fawry Dashboard is backed up at <code>dist-original-backup/</code> and <code>src-original-backup/</code>. To revert, run <code>./revert-to-original.sh</code>
              </p>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
