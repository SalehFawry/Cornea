# =============================================================================
# Nginx — External Reverse Proxy
# Domain : ngnx-fawryplus.fawrypayments.com
# Port   : 9110 (HTTPS)
#
# Traffic routing:
#   /api/v1/  →  FastAPI backend  (127.0.0.1:8000)
#   /metrics  →  BLOCKED (internal only)
#   /         →  React frontend  (127.0.0.1:3063)
#
# Deploy:
#   sudo cp ngnx-fawryplus.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# -----------------------------------------------------------------------------
# KNOWN INFRASTRUCTURE ISSUE — F5 BIG-IP ASM upstream of this nginx
# -----------------------------------------------------------------------------
# An F5 BIG-IP ASM (WAF) sits in FRONT of this nginx instance. The ASM is in
# "Block Response" mode: it forwards the POST request to this backend, FastAPI
# answers it (often with 422 Pydantic validation errors), and the ASM then
# substitutes an HTML "Request Rejected" page with a `Support ID` on the way
# back to the client. Result: backend.log shows 422 for POSTs that the client
# only ever sees as the F5 HTML page.
#
# Server-side fix MUST be applied by the ASM admin — update the security policy
# for vs:9110 to allow POST to (at minimum) the URLs below, OR add a wildcard
# `POST /api/v1/branches/*` Allowed URL entry:
#   POST /api/v1/branches
#   POST /api/v1/branches/{branch_id}/employees
#   POST /api/v1/branches/{branch_id}/shutter-schedule
#   POST /api/v1/branches/{branch_id}/shutter/events
#   POST /api/v1/branches/{branch_id}/cash-door/events
#   POST /api/v1/branches/{branch_id}/alerts
#   POST /api/v1/branches/{branch_id}/attendance/sync
#   POST /api/v1/branches/{branch_id}/customers/sync
#
# For correlation, this config exposes the nginx `$request_id` to the client
# as `X-Request-ID` and writes it into the dedicated
# /var/log/nginx/api-access.log so operators can pair it with the F5 Support
# IDs shown in `Security ›› Event Logs ›› Application ›› Requests`.
# =============================================================================

# ── Upstream definitions ──────────────────────────────────────────────────────
upstream cornea_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream cornea_frontend {
    server 127.0.0.1:3063;
    keepalive 16;
}

# ── Redirect HTTP → HTTPS (optional, add if port 9110 also needs plain HTTP) ──
# server {
#     listen 9110;
#     server_name ngnx-fawryplus.fawrypayments.com;
#     return 301 https://$host:9110$request_uri;
# }

# ── Log format with request-id + upstream status (for F5 Support-ID correlation)
# NOTE: If this `log_format` is already declared at http{} scope in nginx.conf
# (or another conf.d file), remove the block below to avoid "duplicate
# log_format name" errors. Test with `nginx -t` before reloading.
log_format api_json escape=json
    '{'
        '"ts":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"xff":"$http_x_forwarded_for",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"proto":"$server_protocol",'
        '"status":$status,'
        '"upstream_status":"$upstream_status",'
        '"upstream_addr":"$upstream_addr",'
        '"request_length":$request_length,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent",'
        '"api_key_present":"$http_x_api_key"'
    '}';

# ── Main HTTPS server block ───────────────────────────────────────────────────
server {
    # NOTE: HTTP/2 is intentionally NOT enabled on this listener.
    # Workspace policy enforces HTTP/1.0 wire protocol for the Fawry tracking
    # pipeline; HTTP/2 ALPN negotiation has been known to confuse the F5 ASM
    # in front of this host. Nginx will still accept HTTP/1.0 and HTTP/1.1
    # from clients that request them.
    listen 9110 ssl;
    server_name ngnx-fawryplus.fawrypayments.com;

    # ── SSL certificates ─────────────────────────────────────────────────────
    # Replace the paths below with the actual certificate locations.
    ssl_certificate     /etc/ssl/certs/ngnx-fawryplus.fawrypayments.com.crt;
    ssl_certificate_key /etc/ssl/private/ngnx-fawryplus.fawrypayments.com.key;

    # ── TLS hardening ────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # ── Request size limit (raise if CVPC uploads large payloads) ────────────
    client_max_body_size 10M;

    # ── Common proxy headers (applied to all locations) ───────────────────────
    # HTTP/1.1 is kept ONLY for the localhost upstream hop (127.0.0.1:8000) so
    # the `keepalive` pool above stays functional. This is internal loopback
    # traffic and never leaves the box; the workspace HTTP/1.0 rule targets
    # outbound clients and public-facing listeners, both of which are honored
    # elsewhere.
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Port  9110;
    proxy_set_header   Connection        "";       # enable upstream keepalive

    # Preserve/propagate a request-id so FastAPI logs, nginx logs, and the
    # client can all be joined with the F5 Support ID.
    proxy_set_header   X-Request-ID      $request_id;
    add_header         X-Request-ID      $request_id always;

    # ── Block internal-only endpoints from the public internet ───────────────
    location = /metrics {
        deny all;
        return 403;
    }
    location = /ready {
        deny all;
        return 403;
    }

    # Bare /api/v1 (no trailing slash) does not match location /api/v1/ — would hit SPA.
    location = /api/v1 {
        return 301 /api/v1/;
    }

    # ── FastAPI backend — all /api/v1/ traffic ────────────────────────────────
    # ^~ = stop regex search; ensures /api/v1/* never falls through to location /
    # (If API hits the React upstream you get Python http.server "File not found".)
    location ^~ /api/v1/ {
        # Dedicated JSON access log. Captures the REAL status FastAPI returned
        # (`upstream_status`) even when the F5 ASM later rewrites the response
        # to its HTML "Request Rejected" page. Pair `request_id` with the F5
        # Support ID to prove whether the 422/200 came from FastAPI or F5.
        access_log /var/log/nginx/api-access.log api_json;

        proxy_pass         http://cornea_backend;

        # Allow the browser to send the X-API-Key header for auth.
        proxy_pass_request_headers on;

        # CORS preflight — let FastAPI handle it; do not duplicate headers here.
        proxy_hide_header Access-Control-Allow-Origin;

        # Timeouts suited for longer DB queries.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer tuning — disable buffering for streaming/SSE endpoints.
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;

        # If the upstream FastAPI returns 4xx/5xx, DO NOT let nginx swap in a
        # default error page — we want the Pydantic `detail` JSON to reach the
        # client (and the logs) untouched so the real 422 errors surface once
        # the F5 ASM policy is updated.
        proxy_intercept_errors off;
    }

    # ── FastAPI OpenAPI docs (optional — remove to block public access) ────────
    location /api/v1/docs {
        proxy_pass http://cornea_backend;
    }
    location /api/v1/openapi.json {
        proxy_pass http://cornea_backend;
    }

    # ── React frontend — everything else ─────────────────────────────────────
    location / {
        proxy_pass         http://cornea_frontend;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Cache static assets at the proxy layer (Nginx inside Docker caches
        # them too, so this is a belt-and-suspenders optimisation).
        proxy_cache_bypass $http_pragma;
    }
}
